# Prepared only. Do not provision before account-specific cost approval.
services:
  - type: web
    name: cutledger-demo
    runtime: docker
    region: singapore
    plan: standard
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: DATABASE_URL
        fromDatabase:
          name: cutledger-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SESSION_PEPPER
        generateValue: true
      - key: DEMO_ACCESS_CODE_HASH
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_DAILY_REQUEST_LIMIT
        value: "200"
databases:
  - name: cutledger-db
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "17"
    diskSizeGB: 5
    ipAllowList: []
