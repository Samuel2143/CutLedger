name: Verify CutLedger
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash scripts/check.sh
      - run: bash scripts/start.sh
      - run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/actuator/health/readiness; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: python3 scripts/test_setup.py -v
      - run: python3 -W error::ResourceWarning scripts/test_webhook_proxy.py -v
      - run: npm --prefix frontend run test:e2e
